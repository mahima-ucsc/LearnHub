<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Request Sender</title>
</head>
<body>
    <h1>Send a Dynamic Request</h1>
    <p>Enter the `iq` number and click the button below to send a request:</p>
    
    <label for="iqInput">IQ Number:</label>
    <input type="number" id="iqInput" placeholder="Enter IQ number" required>
    <button id="sendRequestBtn">Send Request</button>
    
    <p id="responseMessage" style="margin-top: 20px; color: green;"></p>

    <script>
        document.getElementById('sendRequestBtn').addEventListener('click', function () {
            // Get IQ number from input field
            const iq = document.getElementById('iqInput').value.trim();
            
            if (!iq) {
                document.getElementById('responseMessage').innerText = "Please enter a valid IQ number.";
                return;
            }

            // Base URL
            const baseUrl = "https://www.star-clicks.com/portal/adrouter";
            
            // Generate a random ID
            const randomId = Math.floor(Math.random() * 10000) + 1; // Random id between 1 and 10000
            
            // Construct URL
            const fullUrl = `${baseUrl}?iq=${iq}&id=${randomId}`;

            window.location.href = fullUrl;
            
            // Send request using fetch
            // fetch(fullUrl, { method: 'GET' })
            //     .then(response => {
            //         if (response.ok) {
            //             return response.text();
            //         } else {
            //             throw new Error(`Request failed with status ${response.status}`);
            //         }
            //     })
            //     .then(data => {
            //         // Display success message
            //         document.getElementById('responseMessage').innerText = "Request sent successfully!";
            //     })
            //     .catch(error => {
            //         // Display error message
            //         document.getElementById('responseMessage').innerText = `Error: ${error.message}`;
            //     });
        });
    </script>
</body>
</html>
